name: Viewer checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  viewer:
    name: Viewer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server and persistence tests
        run: python -m unittest discover -s tests -p test_*.py -v
      - name: JavaScript syntax
        run: |
          node --check ui/app.js
          node --check tests/browser.cjs
          node --check tests/recovery.cjs
