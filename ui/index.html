<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP video viewer</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <h1>AP video viewer</h1>
    <span id="course-name"></span>
  </header>
  <main class="layout">
    <section class="viewer">
      <div class="screen">
        <video id="video" controls playsinline></video>
        <div id="ap-player-host" hidden></div>
        <div id="empty-state" class="empty-state">Import an AP unit to begin.</div>
      </div>
      <div class="controls">
        <div class="now-playing">
          <span id="current-title">No video selected</span>
          <div class="navigation">
            <button id="previous" aria-label="Previous video" title="Previous video">←</button>
            <button id="next" aria-label="Next video" title="Next video">→</button>
          </div>
        </div>
        <div class="settings">
          <label>Speed <input id="speed" type="number" min="0.1" max="16" step="0.05" value="1.5">×</label>
          <label>Skip first <input id="trim" type="number" min="0" step="0.1" value="0"> sec</label>
          <button id="set-playhead">Set to current time</button>
          <span id="trim-feedback" class="feedback"></span>
        </div>
      </div>
    </section>
    <aside class="sidebar">
      <div class="import">
        <p>Save the importer as a bookmark. Drag the link onto your bookmarks toolbar, or copy its URL into a new bookmark. Open an AP video, then click that bookmark.</p>
        <div class="import-actions"><a id="import-unit" href="#" title="Drag this link to your bookmarks toolbar">AP unit importer</a><button id="copy-import">Copy bookmark URL</button></div>
        <span id="ap-feedback" class="feedback"></span>
      </div>
      <details id="local-options">
        <summary>Use local video files</summary>
        <div class="local-content">
          <div class="folder-row"><input id="folder" type="text" placeholder="Video folder path" aria-label="Video folder path"><button id="browse">Browse</button></div>
          <div class="folder-row"><button id="use-folder">Load folder</button><button id="export">Export one MP4</button></div>
          <span id="folder-feedback" class="feedback"></span>
          <span id="export-status" class="feedback"></span>
        </div>
      </details>
      <div class="queue-heading"><strong>Queue <span id="clip-count">0</span></strong><button id="refresh">Refresh</button></div>
      <div id="playlist" class="playlist"></div>
    </aside>
  </main>
  <script src="https://fast.wistia.com/player.js" async></script>
  <script src="/app.js"></script>
</body>
</html>
